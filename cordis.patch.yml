# 协作看板 —— 多台机器之间的任务、对话、产出，一屏看得见。
#
# ⚠️ 这个文件必须是**顶层 YAML 数组**，否则 loader 会直接抛错。
# `id` 是设置项命名空间；`name` 必须等于 package.json 的 name。
# patch 的 config 是**整体替换、不深合并**：只写你想改的键是安全的。

- insert:
    - id: collab-board
      name: 'dsh-collab-board'
      config:
        # 数据目录。留空 = ~/.dsh/collab（每台机器各自一份，不互相覆盖）
        dataDir: ''
        # 注意：`syncLanInbox` / `syncIntervalMs` 已于 0.10.0 删掉（lan-share 收件搬运
        # 那条路废弃了），0.11.28 把这两行配置也撤了。写进来不会有任何效果：
        # 代码里没有地方读它们，`SETTINGS_SPEC` 里也没有这两个键。
        # 日志保留条数上限（超过按行裁剪，只留最近这些）
        maxEvents: 5000
